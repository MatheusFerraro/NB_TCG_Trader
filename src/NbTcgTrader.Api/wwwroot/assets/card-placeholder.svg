     stroke-linecap="round" stroke-linejoin="round">
    <rect x="88" y="130" width="74" height="60" rx="6"/>
    <circle cx="107" cy="150" r="7" fill="#9AA3AF" stroke="none"/>
    <path d="M92 186 L120 160 L138 176"/>
    <path d="M132 186 L150 170 L158 178"/>
    <!-- diagonal slash -->
    <line x1="80" y1="122" x2="170" y2="198"/>
  </g>

  <text x="125" y="228" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="600" fill="#8A93A0">No image</text>
