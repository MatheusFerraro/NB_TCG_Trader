<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" role="img" aria-label="No image available">
  <!-- Card face -->
  <rect x="4" y="4" width="242" height="342" rx="14" ry="14"
        fill="#EEF1F5" stroke="#D0D5DD" stroke-width="2"/>
  <!-- Inner frame, suggests a card border -->
  <rect x="20" y="20" width="210" height="310" rx="8" ry="8"
        fill="none" stroke="#E1E5EB" stroke-width="1.5"/>

  <!-- image-off glyph -->
