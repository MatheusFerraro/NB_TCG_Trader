services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nbtcg
      POSTGRES_PASSWORD: nbtcg_dev_password
      POSTGRES_DB: nbtcg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbtcg -d nbtcg"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Service name "db" resolves on the compose network. Used by EF/Npgsql in #5.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=nbtcg;Username=nbtcg;Password=nbtcg_dev_password"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
